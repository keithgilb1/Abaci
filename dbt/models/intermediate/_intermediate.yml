version: 2

models:
  - name: int_rates_monthly
    description: Monthly averages of the FRED series, as decimals.
    columns:
      - name: month_start
        data_tests: [unique, not_null]
      - name: treasury_3y_yield
        data_tests:
          - abaci_in_range:
              arguments:
                min_value: 0
                max_value: 0.2
      - name: treasury_5y_yield
        data_tests:
          - abaci_in_range:
              arguments:
                min_value: 0
                max_value: 0.2
