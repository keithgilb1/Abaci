# Ask Abaci LoRA fine-tune. Run with: make ask-train (about 45 minutes on an M5 MacBook with 16 GB).
model: mlx-community/Qwen2.5-Coder-3B-Instruct-4bit   # 4-bit, about 1.7 GB, so training fits in 16 GB
train: true
data: ask/data
fine_tune_type: lora
mask_prompt: true          # learn the JSON answer only, not the catalog in the system prompt
num_layers: 16
batch_size: 4
iters: 600                 # two passes over 1,200 examples
learning_rate: 1.0e-4
steps_per_report: 25
steps_per_eval: 100
val_batches: 15
save_every: 200
max_seq_length: 1024
grad_checkpoint: true
adapter_path: ask/adapters
seed: 7
lora_parameters:
  rank: 8
  scale: 20.0
  dropout: 0.0
